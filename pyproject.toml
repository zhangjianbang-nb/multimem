[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multimem"
version = "0.2.0"
description = "Multimodal agent memory: episodic + semantic memory over text/images/video frames, hybrid retrieval, consolidation, and a dependency-free MCP server."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Jianbang Zhang" }]
requires-python = ">=3.10"
keywords = ["agent", "memory", "multimodal", "rag", "mcp", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "pillow>=9.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
multimem = "multimem.cli:main"

[project.urls]
Homepage = "https://github.com/zhangjianbang-nb/multimem"

[tool.setuptools.packages.find]
include = ["multimem*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
